services:
  - type: web
    name: whatslark-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: NEXT_PUBLIC_APP_URL
        value: https://larkflow.io
      - key: SUPABASE_URL
        fromDatabase: false
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v19.0
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100
      - key: RAZORPAY_ENABLED
        value: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BILLING_CURRENCY
        value: INR
      - key: BILLING_GRACE_PERIOD_DAYS
        value: 3
